name: CI

# Quality gates from 00-Project-Foundation.md section 14.4.
#
# With a solo developer there is no second reviewer, so these checks ARE the
# review (section 4.5). A red pipeline is never merged and never disabled:
# turning off a failing check converts a known problem into an unknown one.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` installs exactly the lockfile, so CI cannot silently resolve
      # a different dependency tree than the developer machine.
      - name: Install dependencies
        run: npm ci

      # contracts must be built first: both applications import its compiled
      # output, and npm workspaces does not guarantee topological ordering.
      - name: Build shared contracts
        run: npm run build --workspace @agencyflow/contracts

      # Gates run cheapest first so an obvious failure reports in seconds
      # rather than after a full build.
      - name: Gate 1 - Format check
        run: npx prettier --check .

      - name: Gate 2 - Lint (zero warnings)
        run: npx eslint . --max-warnings=0

      - name: Gate 3 - Type check
        run: npm run typecheck

      - name: Gate 4 - Tests
        run: npm run test

      - name: Gate 5 - Build
        run: |
          npm run build --workspace @agencyflow/api
          npm run build --workspace @agencyflow/web

      # Advisories in the dependency tree are surfaced but do not block a
      # feature branch. This becomes blocking before delivery (NFR-26).
      - name: Gate 6 - Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true

  # The gates above all run against a full workspace install on the runner's
  # filesystem. That is not what ships. The deployed artefact is a container
  # built from a PRUNED install, and every difference between the two is a
  # place where CI can be green while the deploy is broken.
  #
  # Two real failures motivated this job, both invisible to the gates above:
  #
  #   - `@agencyflow/config` supplies the tsconfig every workspace extends,
  #     and nothing declared it. A full install linked it by accident; a
  #     pruned one did not, and the build failed on a missing tsconfig.
  #   - the root `prepare` script runs `husky`, which is a devDependency.
  #     `npm ci --omit=dev` therefore died with `husky: not found`.
  #
  # Neither could fail on a developer machine. Building the image is the only
  # check that exercises what is actually deployed.
  container:
    name: API container builds
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f apps/api/Dockerfile -t agencyflow-api:ci .

      # Boot it with no configuration. Reaching environment validation proves
      # the whole module graph loaded — every Nest module, every Mongoose
      # schema, and the compiled contracts package resolved through its
      # workspace symlink. A missing dependency fails here, not at 3 a.m.
      - name: Boot the image far enough to prove it is wired correctly
        run: |
          set +e
          output=$(docker run --rm agencyflow-api:ci 2>&1)
          echo "$output"
          echo "$output" | grep -q "Invalid environment configuration" || {
            echo "::error::Image did not reach environment validation — the module graph failed to load."
            exit 1
          }
          echo "Reached environment validation as expected."
