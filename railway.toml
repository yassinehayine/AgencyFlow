# Railway configuration — AgencyFlow API (ADR-0006)
#
# Infrastructure as code rather than dashboard clicks: the deployment is
# reviewable in a Pull Request, and rebuilding the service after a mistake is
# a re-apply instead of an archaeology exercise.
#
# TOML rather than `railway.json` for one reason: comments. The decisions
# below each cost an afternoon to rediscover, and a JSON file cannot explain
# itself.
#
# `05-Software-Architecture.md` §15, as amended by ADR-0006: Railway for the
# NestJS API, Vercel for the web client, MongoDB Atlas M0 for the database.
#
# To apply: Railway -> New Project -> Deploy from GitHub repo. Railway reads
# this file. The secrets are then set in the service's Variables tab; they are
# secrets and must never reach this file (NFR-25).

[build]
# DOCKERFILE, not the automatic builder, and this is the fix for a real
# failure rather than a preference.
#
# Railpack inspects the repository and configures itself from what it finds.
# It found the Vite frontend and mounted a build cache at
# `apps/web/node_modules/.vite` — for a service that never builds the
# frontend. `npm ci` begins by removing `node_modules`, a mount point cannot
# be removed, and every build died on:
#
#     EBUSY: resource busy or locked, rmdir '/app/apps/web/node_modules/.vite'
#
# A backend build failing on a frontend path is a builder acting on a guess
# about a repository it only half understands. The Dockerfile states what the
# image contains instead of leaving it to be inferred: the frontend is not
# skipped, it is never in the build context.
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

# Only rebuild when something the API depends on changed. Without this, every
# frontend commit rebuilds and restarts the backend — on a metered plan,
# credit spent to produce a byte-identical image (AR-11).
#
# `apps/web` is deliberately absent, which is now enforced twice: by this list
# and by `.dockerignore`.
watchPatterns = [
  "apps/api/**",
  "packages/config/**",
  "packages/contracts/**",
  "package.json",
  "package-lock.json",
  "railway.toml",
]

[deploy]
# No `startCommand`. The Dockerfile's CMD is the single definition of how this
# image starts; repeating it here would create two, and the one that is wrong
# is always the one nobody edited.

# Railway polls this path and holds the old deployment in place until it
# answers, so a boot failure leaves the previous version serving rather than
# taking the service down. `/health` is deliberately outside `/api/v1` so this
# contract survives an API version bump (00-Project-Foundation §12.5).
healthcheckPath = "/health"

# Generous on purpose. The check has to cover container start, the Mongoose
# connection to Atlas, and the first Cloudinary probe. A tight timeout fails a
# deployment that was merely slow, and the retry costs more than the wait.
healthcheckTimeout = 300

# A crash is worth retrying — a bad deploy is not worth retrying forever.
# `ALWAYS` would restart-loop on a genuine configuration error, burning
# credits while producing the same failure (AR-11); the bounded count makes
# the service stop and show it.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
