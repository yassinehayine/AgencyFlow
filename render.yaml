# Render Blueprint — AgencyFlow API
#
# Infrastructure as code rather than dashboard clicks: the deployment is
# reviewable in a Pull Request, and rebuilding the service after a mistake is
# a re-apply instead of an archaeology exercise.
#
# 05-Software-Architecture.md section 15 fixes the target: Render Free for the
# NestJS API, Vercel for the web client, MongoDB Atlas M0 for the database.
#
# To apply: Render Dashboard -> New -> Blueprint -> select this repository.
# The three `sync: false` variables must then be filled in by hand; they are
# secrets and must never reach this file (NFR-25).

services:
  - type: web
    name: agencyflow-api
    runtime: node
    plan: free
    # Closest region to Morocco of those Render offers on the free plan.
    region: frankfurt
    branch: main
    autoDeploy: true

    # `--include=dev` is not optional. NODE_ENV is `production` below, and npm
    # skips devDependencies whenever it is set — which would remove @nestjs/cli
    # and typescript, the two things the build needs most.
    #
    # The contracts package is built explicitly before the API: it is a
    # workspace dependency resolved through a symlink, so its `dist` must
    # exist before `nest build` type-checks against it.
    buildCommand: >-
      npm ci --include=dev &&
      npm run build --workspace @agencyflow/contracts &&
      npm run build --workspace @agencyflow/api

    # Run from the repository root so the workspace symlink in the root
    # node_modules resolves @agencyflow/contracts.
    startCommand: node apps/api/dist/main.js

    # Render polls this path and refuses to route traffic to an instance that
    # does not answer. `/health` is deliberately outside `/api/v1` so this
    # contract survives an API version bump (00-Project-Foundation 12.5).
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # PORT is injected by Render; the application reads it from the
      # environment and must not hard-code it.

      # --- Secrets: set in the Render dashboard, never in this file ---------
      - key: MONGODB_URI
        sync: false # MongoDB Atlas M0 mongodb+srv connection string
      - key: CLOUDINARY_URL
        sync: false # cloudinary://<api_key>:<api_secret>@<cloud_name>
      - key: CORS_ORIGIN
        sync: false # The Vercel production origin, no trailing slash

      # Generated once by Render and never displayed in the repository. A
      # production signing key that differs from the development one means a
      # leaked dev token cannot authenticate against production (BR-10, NFR-19).
      - key: JWT_SECRET
        generateValue: true

      - key: CLOUDINARY_FOLDER
        value: agencyflow
